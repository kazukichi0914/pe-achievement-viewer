<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="hero"></div>

  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 2h16l-4 9H8z" fill="#fff"/>
        <path d="M8 2h8l-4 9z" fill="#aecbfa"/>
        <circle cx="12" cy="16" r="6" fill="#fbbc04"/>
        <path d="M12 12.6l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z" fill="#fff"/>
      </svg>
      <span>Product Experts</span>
    </div>
    <button id="refresh" class="icon-btn" title="最新の情報を取得">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
    </button>
  </header>

  <main>
    <section class="card" id="summary">
      <div class="card-title">達成状況</div>
      <div class="divider"></div>

      <div id="status"></div>

      <div id="content" hidden>
        <div class="selector">
          <div class="select-wrap">
            <select id="product" aria-label="製品を選択"></select>
          </div>
          <button id="prev" class="icon-btn nav" title="前の製品">
            <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
          </button>
          <button id="next" class="icon-btn nav" title="次の製品">
            <svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg>
          </button>
        </div>

        <div class="tiles">
          <div class="tile medal-tile">
            <div id="medal"></div>
            <div id="level" class="level"></div>
          </div>
          <div class="tile">
            <div id="active" class="num"></div>
            <div class="desc">現在アクティブな<br>ポイント数</div>
          </div>
          <div class="tile">
            <div id="days" class="num"></div>
            <div class="desc">次のサイクルまで<br>の日数</div>
          </div>
        </div>

        <div class="section-label">全体の達成状況</div>
        <div class="track">
          <div id="fill" class="fill"></div>
          <div id="marker" class="marker">
            <svg viewBox="0 0 24 24"><path d="M12 7.5l1.4 2.9 3.1.4-2.3 2.2.6 3.1L12 14.6l-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z" fill="#fff"/></svg>
          </div>
        </div>
        <div id="track-labels" class="track-labels"></div>
        <div id="to-next" class="to-next"></div>

        <div id="warning" class="banner" hidden>
          <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2zm12-3h-2v-2h2zm0-4h-2v-4h2z"/></svg>
          <span></span>
        </div>

        <div class="section-label">ポイントの内訳</div>
        <div id="breakdown" class="breakdown"></div>
      </div>
    </section>

    <section class="card" id="all" hidden>
      <div class="card-title">すべての製品</div>
      <div class="divider"></div>
      <div id="list"></div>
    </section>
  </main>

  <footer>
    <span id="updated"></span>
    <a href="https://productexperts.withgoogle.com/profile" target="_blank">プロフィールを開く</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
